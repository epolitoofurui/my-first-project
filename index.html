<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        header p {
            text-align: center;
            margin-bottom: 30px;
        }

        #add-expense {
            background-color: #dbeafe;
            padding: 20px;
            margin: 0 auto 20px;
            max-width: 500px;
            border-radius: 8px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Class selector */
        .expenses-placeholder {
            background-color: #dcfce7;
            padding: 20px;
            margin: 0 auto;
            max-width: 500px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>

        <section id="add-expense">
            <h2>Add Expense</h2>

            <div class="input-group">
                <label for="expense-name">Expense Name</label>
                <input type="text" id="expense-name" placeholder="e.g. Groceries">
            </div>

            <div class="input-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="e.g. 50">
            </div>

            <div class="input-group">
                <label for="category">Category</label>
                <input type="text" id="category" placeholder="e.g. Food">
            </div>
        </section>

        <section class="expenses-placeholder">
            <h2>Your Expenses</h2>
            <p>No expenses yet.</p>
        </section>

    </main>

</body>
</html>
